name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels an in-flight run, so a rapid series of
# commits on a PR doesn't queue up redundant lint jobs.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Linting is static analysis — it never imports the app, so it needs
      # ruff alone, not the runtime deps. Keep this pin in sync with
      # backend/requirements-dev.txt.
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  frontend:
    name: Frontend (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
