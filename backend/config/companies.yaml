# Companies to fetch jobs from via ATS public APIs.
# source: greenhouse | ashby | lever  (adapters exist in app/sources)
#         workday | workable | smartrecruiters | breezy | comeet | recruiterbox
#         | eightfold  (no adapter yet — seeded for when one is built, see
#         CLAUDE.md 'Adding an ATS'; these companies yield zero jobs today)
# slug: the board slug used in the API endpoint
#
# Greenhouse: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs
# Ashby:      https://api.ashbyhq.com/posting-api/job-board/{slug}
# Lever:      https://api.lever.co/v0/postings/{slug}
#
# 15 companies use custom career pages (no public ATS API) and are excluded:
# OpenAI, Retool, LivePerson, Talkdesk, Dialpad, Gong, Genesys,
# Salesforce, Langfuse, Cognigy, Make.com, Semios, Hugging Face, Zep AI, Maxim AI
