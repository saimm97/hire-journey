# ── Filters ──────────────────────────────────────────────────────
# Applied after fetching, before storing.

title_filter:
  positive:
    # AI / ML
    - "AI"
    - "ML"
    - "Machine Learning"
    - "LLM"
    - "Agent"
    - "GenAI"
    - "NLP"
    - "MLOps"
    - "Data Scientist"
    # General Engineering
    - "Software Engineer"
    - "Software Developer"
    - "Full Stack"
    - "Fullstack"
    - "Frontend"
    - "Front-end"
    - "Backend"
    - "Back-end"
    - "Platform Engineer"
    - "Infrastructure"
    - "DevOps"
    - "SRE"
    - "Site Reliability"
    - "Cloud Engineer"
    # Languages / frameworks commonly in job titles
    - "Python"
    - "TypeScript"
    - "React"
    - "Node"
    - "Go "
    - "Rust"
    # Data
    - "Data Engineer"
    - "Analytics Engineer"
    # Solutions / Deployment
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Solutions Architect"
  negative:
    - "Intern"
    - "Junior"
    - "Sales"
    - "Marketing"
    - "Recruiter"
    - "HR"
    - "Finance"
    - "Legal"
    - "Accountant"
    - "Office Manager"

location_filter:
  allow:
    - "Remote"
    - "United States"
    - "United Kingdom"
    - "Dubai"
    - "London"
    - "New York"
    - "San Francisco"
  block:
    - "India"
    - "Singapore"
    - "Japan"
    - "Brazil"
