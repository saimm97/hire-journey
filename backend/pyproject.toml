[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-engine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",       # async PostgreSQL driver
    "psycopg2-binary>=2.9.0", # sync driver (alembic needs it)

    # Config
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Auth
    "PyJWT>=2.10.0",            # JWT signing/verification (replaces python-jose)
    "bcrypt>=4.1.0",            # password hashing (used directly, not via passlib)
    "email-validator>=2.0.0",  # backs pydantic EmailStr
    "google-auth>=2.40.0",     # verifies Google ID tokens for "Continue with Google"
    "python-multipart>=0.0.9",

    # Resume parsing
    "PyMuPDF>=1.24.0",       # PDF text extraction (import: fitz)
    "python-docx>=1.1.0",    # DOCX text extraction (import: docx)

    # LLM providers
    "langchain-google-genai>=2.0.0",
    # 1.x provider releases require langchain-core>=1.4 (conflicts with langchain 0.3)
    "langchain-groq>=0.3.0,<1",
    "langchain-openai>=0.3.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic migrations are autogenerated and effectively frozen history; don't
# lint or format them. env.py (hand-maintained) is intentionally still checked.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# The formatter owns line length; it may intentionally leave long strings,
# comments, or unbreakable tokens past the limit, so don't double-flag them.
ignore = ["E501"]

[tool.ruff.format]
# Black-compatible defaults (double quotes, trailing commas, etc.).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
